# Kourti self-hosted production stack.
#
# Run with the install directory (default /opt/kourti) as the project
# directory — `kourtictl` does this for you:
#   docker compose --project-directory /opt/kourti -f /opt/kourti/src/deploy/docker-compose.yml ...
# Relative paths below resolve against that directory:
#   ./src       git checkout of the application
#   ./.env      generated configuration + secrets (install.sh)
#   ./Caddyfile generated reverse-proxy config     (install.sh)
#   ./certs     TLS certificate + key              (install.sh)
#
# Only the Caddy proxy publishes ports. /api and /health go straight to the
# backend (Caddy sets X-Forwarded-Proto=https, which the production backend
# requires); everything else goes to the frontend container.

name: kourti

services:
  postgres:
    # postgres:16-alpine + pgvector (document search); see deploy/postgres/Dockerfile
    build:
      context: ./src/deploy/postgres
    image: kourti-postgres:16-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the tables the backend bootstrap does not (tasks, notifications, …).
      - ./src/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./src/backend-node
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Postgres is only on the internal compose network and has no TLS.
      DB_SSL: "false"
      STORAGE_DRIVER: fs
      STORAGE_PATH: /app/storage
    volumes:
      - backend-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  app:
    build:
      context: ./src
      args:
        VITE_APP_URL: ${PUBLIC_URL}
        VITE_BACKEND_API_URL: ${PUBLIC_URL}
        VITE_USE_NODE_BACKEND: "true"
        VITE_API_TIMEOUT: "30000"
        VITE_SIGNUP_ENABLED: ${SIGNUP_ENABLED:-false}
        VITE_DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
        # Upstream's Microsoft Clarity / Mixpanel analytics: off for self-hosted firms.
        VITE_ANALYTICS_ENABLED: "false"
    restart: unless-stopped
    environment:
      PORT: 80
      BACKEND_URL: http://backend:4000
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      - backend

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - backend

volumes:
  postgres-data:
  backend-storage:
  caddy-data:
  caddy-config:
